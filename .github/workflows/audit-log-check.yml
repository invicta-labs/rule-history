name: Audit log check
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node canary/check-audit-log.mjs
        env:
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          CLOUD_ID: e274eb4a-2a1d-405d-87d6-ec41a9a7dc09
      - name: Key expiry reminder
        if: always()
        run: node canary/check-key-dates.mjs
